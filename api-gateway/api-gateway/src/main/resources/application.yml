spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: ms-auth
              uri: lb://ms-auth
              predicates:
                - Path=/api/auth/**

            - id: ms-producto
              uri: lb://ms-producto
              predicates:
                - Path=/api/productos/**

            - id: ms-pedidos
              uri: lb://ms-pedidos
              predicates:
                - Path=/api/pedidos/**

            - id: ms-clientes
              uri: lb://ms-clientes
              predicates:
                - Path=/api/clientes/**

            - id: ms-pagos
              uri: lb://ms-pagos
              predicates:
                - Path=/api/pagos/**

            - id: ms-reportes
              uri: lb://ms-reportes
              predicates:
                - Path=/api/reportes/**

            - id: ms-inventarios
              uri: lb://ms-inventarios
              predicates:
                - Path=/api/inventarios/**

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
